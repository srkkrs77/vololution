name: Mirror to Codeberg
on:
  push:
    branches: [ main ]
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to Codeberg
        uses: lissy93/repo-mirror-action@v1
        with:
          ssh_key: ${{ secrets.MIRROR_SSH }}